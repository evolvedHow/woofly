# woof.LY — default app configuration
# Upload a custom woofly_config.yaml from Settings to override everything here.
version: "1.0.0"

app:
  name: "woof.LY"
  tagline: "paw-sitively local & offline"
  avatar_default: "🐾"
  max_photo_bytes: 204800
  accent: "#22c55e"
  share_prefix: "https://woof.ly/#/sniff?data="
  map_default: [40.7128, -74.006]

personas:
  - id: sassy_pug
    name: "Sassy Pug"
    emoji: "🐶"
    style: "sassy"
    greeting: "We interrupt this walk for a dramatic announcement: I am adorable."
    system_prompt: |
      You are Sassy Pug, a grumpy-but-loving pug with a tiny nose, huge opinions,
      and zero patience for squirrels that do not respect his personal space. You
      narrate the day's walk, messages, and accomplishments as an unhinged, witty
      dog monologue. Reply in 1-3 short sentences, playful and absurd, using
      dog-centric metaphors. Keep it wholesome and family friendly. Use emoji
      sparingly. Never reveal that you are an AI.
  - id: wise_golden
    name: "Wise Golden"
    emoji: "🐕"
    style: "wise"
    greeting: "Good sit, good sniff. I have seen many lawns in my time."
    system_prompt: |
      You are Barnaby, a serene golden retriever philosopher who understands the
      universe one smell at a time. You speak in calm, poetic, slightly mystical
      two-sentence musings about walks, snacks, and the true meaning of squirrels.
      Reply in 2-3 short sentences. Occasional emoji. Family friendly. Never
      reveal that you are an AI.
  - id: scully_terrier
    name: "Scully the Terrier"
    emoji: "🐩"
    style: "chaotic"
    greeting: "Target acquired: every stick. Speaking sticky, reporting."
    system_prompt: |
      You are Scully, a terrier whose entire personality is a passionate
      vendetta against the neighborhood cat named Kevin, plus a deep obsession
      with sticks. Narrate the walk like a hammy spy dispatcher. Reply in 1-3
      short sentences, silly and dramatic, but never actually mean. Family
      friendly. Occasional emoji. Never reveal that you are an AI.

badges:
  - id: first_tail_wag
    title: "First Tail Wag"
    icon: "🐶"
    description: "Complete your very first walk."
    condition: { type: walks_count, threshold: 1 }
  - id: sofa_to_marathon
    title: "Sofa to Marathon"
    icon: "🏃"
    description: "Walk your first 5 km in total."
    condition: { type: total_distance_km, threshold: 5 }
  - id: hydrant_royalty
    title: "Hydrant Royalty"
    icon: "🚿"
    description: "Claim 3 hydrants as your territory."
    condition: { type: hydrants_claimed, threshold: 3 }
  - id: paparazzi_pup
    title: "Paparazzi Pup"
    icon: "📸"
    description: "Snap 3 photos during your adventures."
    condition: { type: photos_taken, threshold: 3 }
  - id: squad_up
    title: "Squad Up"
    icon: "🐕‍🦺"
    description: "Exchange passports with 2 new friends."
    condition: { type: friends_count, threshold: 2 }
  - id: chatty_pup
    title: "Chatty Pup"
    icon: "💬"
    description: "Hold 5 AI woof barks."
    condition: { type: ai_woofs, threshold: 5 }
  - id: legend_of_the_park
    title: "Legend of the Park"
    icon: "🏆"
    description: "Travel a total of 25 km across all walks."
    condition: { type: total_distance_km, threshold: 25 }
  - id: iron_paws
    title: "Iron Paws"
    icon: "🥇"
    description: "Complete 10 walks."
    condition: { type: walks_count, threshold: 10 }
  - id: king_of_the_corner
    title: "King of the Corner"
    icon: "👑"
    description: "Claim 10 hydrants."
    condition: { type: hydrants_claimed, threshold: 10 }
  - id: pack_leader
    title: "Pack Leader"
    icon: "🎖️"
    description: "Gather 5 friends in your passport."
    condition: { type: friends_count, threshold: 5 }

openrouter_defaults:
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  model: "openai/gpt-4o-mini"
  temperature: 0.9
  max_tokens: 240
  site_url: "https://woof.ly"
  app_name: "woof.LY"

walk_defaults:
  min_gps_accuracy: 40
  pause_distance_threshold_m: 3
  hydrant_claim_prompt: "Ooh, an important hydrant. Name your territory:"